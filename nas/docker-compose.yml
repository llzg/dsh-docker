services:
  deepseek-harness:
    # DSH 版本更新机制（2026-09 起）：
    #   Renovate(发现/SSOT) → CI(immutable build) → dsh-safe-deploy(隔离测试+promote+rollback)
    # DSH 已退出 Watchtower 自动替换（label 禁用）；watchtower 仅保留给无状态/低风险容器。
    # 回滚：dsh-safe-deploy rollback（恢复旧 image + snapshot + env），不依赖 tag 覆盖。
    image: ${DSH_IMAGE:-ghcr.io/llzg/dsh-docker:0.1.1-rc.2}
    container_name: deepseek-harness
    restart: unless-stopped
    ports:
      - "3081:3080"
      - "3082:3082"
    environment:
      - DSH_HOME=/data/dsh
      - DSH_TELEMETRY_DISABLED=1
    volumes:
      - ./dsh-data:/data/dsh
      # 持久化 /root（含 DSH 工作区 /root/nas_docker）：
      # 容器重建时若工作区目录不存在，bash 工具的 spawn cwd 失效会导致
      # 所有命令报 "spawn <cmd> ENOENT"（2026-08-16 事故根因），挂载后根治。
      - ./dsh-root:/root
      # ── Phase 5 go-live（2026-08-26）：宿主 Docker socket 挂入 DSH ──
      # 使 Codex/DSH 能 inspect/exec 生产容器（docker exec preflight 等）。
      # 安全边界：docker.sock == host root-equivalent；只挂给可信 agent，
      # DSH UI 禁止公网匿名访问。应用后需重建容器：
      #   docker compose up -d --force-recreate deepseek-harness
      - /var/run/docker.sock:/var/run/docker.sock
      # GitHub SSH（可选）：宿主存在 GitHub deploy key 时启用只读挂载。
      # ⚠ 若宿主路径不存在，docker compose up 会失败——先确认宿主 key 路径。
      # - /root/.ssh:/root/.ssh:ro
      # - /home/lzg/.ssh:/root/.ssh:ro
    # Intel 核显直通（Iris Xe，加速本地视觉模型的图像编码）：
    # 宿主需已加载 i915 驱动（绿联 x86 NAS 默认有）。应用后需重建容器生效：
    #   docker compose up -d --force-recreate deepseek-harness
    # 无此设备时容器内仍可运行，视觉推理退回纯 CPU。
    devices:
      - /dev/dri:/dev/dri
    labels:
      - "org.opencontainers.image.title=DeepSeek Harness Web (dsh)"
      - "org.opencontainers.image.description=DeepSeek Harness web UI — auto-built from npm release, controlled promote via dsh-safe-deploy"
      # 关键：DSH 退出 Watchtower 自动更新（防未经验证的跨版本替换）。
      # watchtower 仍可管理其他无状态容器；只有此服务被排除。
      - "com.centurylinklabs.watchtower.enable=false"
