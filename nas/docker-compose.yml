# DSH 双通道部署 compose（契约：docs/dual-channel.md §2 / §6 / §9）
#
# 每通道一个 compose 项目：项目名 = DSH_PROJECT，容器名 = DSH_CONTAINER。
# ⚠ 所有调用必须走 nas/lib.sh 的 compose_cmd()：
#     docker compose -p "$DSH_PROJECT" --project-directory "$DIR" -f "$DIR/docker-compose.yml"
#   否则 compose 会用挂载目录名推断 project name（历史上把项目解析成 dsh-app、
#   把卷源解析成 /dsh-app/dsh-data 的 P0 事故），并在 pin 时被 validate_compose_context 拒绝。
#
# 可选 override（compose_cmd 自动按存在性追加 -f）：
#   docker-compose.versionpage.yml  DSH_VERSION_PORT != 0 时挂版本页端口（alpha=3082）
#   docker-compose.igpu.yml         Intel 核显直通（由 apply-igpu.sh 生成；base 不硬依赖）
name: ${DSH_PROJECT:-dsh-alpha}

services:
  dsh:
    # DSH 版本更新机制（2026-09 起）：
    #   Renovate(发现/SSOT) → CI(immutable build) → dsh-safe-deploy(隔离测试+promote+rollback)
    # DSH 已退出 Watchtower 自动替换（label 禁用）；watchtower 仅保留给无状态/低风险容器。
    # 回滚：dsh-safe-deploy rollback / nas/rollback.sh（恢复旧 image + snapshot + .env 钉住）。
    # ⚠ 必填、无默认值：latest 只由 stable 通道发布（实测停在 0.1.1-rc.2），
    # 用 ${DSH_IMAGE:-…:latest} 会让漏配 .env 的场景静默降级到旧版本。
    # 缺 DSH_IMAGE 时 compose config/up 直接报错，而不是悄悄跑旧版本。
    image: "${DSH_IMAGE:?DSH_IMAGE 未设置：请先运行 install.sh 生成 .env}"
    container_name: ${DSH_CONTAINER:-dsh-alpha}
    restart: unless-stopped
    # 与镜像默认 CMD 等价，但 **$DSH_TRUSTED_HOST 不加引号** → 支持空格分隔的多个受信地址
    # （DSH 的 --trusted-host 是 <authority...> 变参）。
    command: ["sh", "-c", "exec dsh --profile web --trusted-host $DSH_TRUSTED_HOST --no-open"]
    ports:
      # 两种对外模式（Phase 2）：
      #   A) 直接发端口（默认）：DSH_BIND_IP=0.0.0.0 + DSH_PUBLISH_PORT=3081
      #   B) proxy 反代模式：DSH_BIND_IP=127.0.0.1 + DSH_PUBLISH_PORT=3080（回环）
      #      + 起 proxy 服务（--profile proxy）：proxy 用 host 网络对外监听 DSH_PORT=3081，
      #      回代 BACKEND=http://127.0.0.1:3080，保留 CIDR 白名单/令牌注入等特性。
      # ⚠ 两个端口必须分开写：proxy 模式如果 dsh 服务也发 DSH_PORT，会和 proxy 抢同一个
      #   宿主端口，compose up 直接失败（bind: address already in use）。
      - "${DSH_BIND_IP:-0.0.0.0}:${DSH_PUBLISH_PORT:?DSH_PUBLISH_PORT 未设置：直发模式填 DSH_PORT(如 3081)，proxy 模式填 3080（回环）}:3080"
    environment:
      # ⚠ 不能写死 /data/dsh：alpha 通道的真实 DSH_HOME 是 /data/dsh/test/0.1.2-alpha.5
      #   （历史 pin 的工作区路径），写死会让 alpha 换了工作区、设置/插件全部"消失"。
      - DSH_HOME=${DSH_HOME:-/data/dsh}
      - DSH_CHANNEL=${DSH_CHANNEL:-alpha}
      - DSH_TELEMETRY_DISABLED=1
      # --trusted-host 不再硬编码在 Dockerfile CMD（契约 §6）
      # ⚠ 可以放多个 authority（空格分隔）：DSH 的 /api 浏览器信任围栏按请求的 **Host** 匹配，
      #   而 proxy 会**保留客户端 Host** 转发 —— 用户用哪个地址访问，那个地址就必须在列表里。
      #   实测事故（2026-09-10）：容器只信任 192.168.5.17，而用户浏览器用 192.168.5.16 访问 →
      #   `GET /` 能打开、但 `/api/*` 与 WebSocket(`/api/remote.mux`) 全部 403，
      #   界面表现为"一直重连 / 无法加载 Agent 预设"。改回/补齐 .16 即可。
      #   注意下面 command 里对这个变量**故意不加引号**，让空格分隔的多值展开成多个 --trusted-host。
      - DSH_TRUSTED_HOST=${DSH_TRUSTED_HOST:-192.168.5.16 192.168.5.17}
      # ⚠ 用 host 网络跑 proxy 的容器必须显式设 0：0 之外的取值会让 entrypoint 在
      #   **宿主机**上另起一个镜像内置的版本页，把 3082 抢掉（实测：真正的 dsh-version
      #   因此绑不上端口而反复重启，页面显示的是旧代码渲染的单通道页）。
      - DSH_VERSION_PORT=${DSH_VERSION_PORT:-3082}
      # 启动令牌：proxy 的 BOOTSTRAP_TOKEN 必须与它一致，否则反代回来是 401。
      - DSH_LAUNCH_TOKEN=${DSH_LAUNCH_TOKEN:-}
      # SSOT 文件绝对路径（优先级最高；空则走容器内默认查找顺序）。
      # ⚠ 填宿主路径时必须额外挂载；推荐 /root/nas_docker/dsh-version.json
      #   （已由 ./dsh-root:/root 挂载，命中宿主实时 SSOT）。
      - DSH_VERSION_SSOT=${DSH_VERSION_SSOT:-}
      - DSH_PIN_REASON=${DSH_PIN_REASON:-}
      # ── 出网代理（与当前手写容器保持一致）──────────────────────────────
      # ⚠ 不能漏：宿主上 GitHub 直连是**卡死**的（实测 25s 超时 0 字节），而 DSH 工作区
      #   里的插件安装/pnpm 会拉 GitHub。NO_PROXY 必须包含内网段与 api.deepseek.com
      #   （LLM 调用走直连，走代理会明显变慢）。
      - HTTP_PROXY=${DSH_HTTP_PROXY:-}
      - HTTPS_PROXY=${DSH_HTTP_PROXY:-}
      - http_proxy=${DSH_HTTP_PROXY:-}
      - https_proxy=${DSH_HTTP_PROXY:-}
      - NO_PROXY=${DSH_NO_PROXY:-localhost,127.0.0.1,minio,invoice-minio,invoice-redis,192.168.5.0/24,api.deepseek.com,172.27.0.0/16}
      - no_proxy=${DSH_NO_PROXY:-localhost,127.0.0.1,minio,invoice-minio,invoice-redis,192.168.5.0/24,api.deepseek.com,172.27.0.0/16}
    volumes:
      - ./dsh-data:/data/dsh
      # 持久化 /root（含 DSH 工作区 /root/nas_docker）：
      # 容器重建时若工作区目录不存在，bash 工具的 spawn cwd 失效会导致
      # 所有命令报 "spawn <cmd> ENOENT"（2026-08-16 事故根因），挂载后根治。
      - ./dsh-root:/root
      # 宿主 Docker socket **不在基座里**（见文件尾注释）：它等价于 host root 权限，
      # 只有确实需要的通道才挂 —— 由 docker-compose.docker-sock.yml 这个可选 override 提供
      # （alpha 目录放它、rc 目录不放，保持"rc 无 docker.sock"的现状）。
      # GitHub SSH（可选）：宿主存在 GitHub deploy key 时启用只读挂载。
      # ⚠ 若宿主路径不存在，docker compose up 会失败——先确认宿主 key 路径。
      # - /root/.ssh:/root/.ssh:ro
      # - /home/lzg/.ssh:/root/.ssh:ro
    labels:
      - "org.opencontainers.image.title=DeepSeek Harness Web (dsh)"
      - "org.opencontainers.image.description=DeepSeek Harness web UI — auto-built from npm release, controlled promote via dsh-safe-deploy"
      # 关键：DSH 退出 Watchtower 自动更新（防未经验证的跨版本替换）。
      # watchtower 仍可管理其他无状态容器；只有此服务被排除。
      - "com.centurylinklabs.watchtower.enable=false"
    # 日志轮转（P2）：json-file 默认无上限，长跑会撑满 NAS 根分区
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ── 可选：宿主网络反代（只有带 --profile proxy 时才起，默认不参与）────────────
  # 与当前生产上的 dsh-proxy / dsh-proxy-rc 配置 1:1 对齐（cmd / 挂载 / env / 探活），
  # 供 Phase 2 把"host 网络 proxy + 固定 IP 反代"这层也纳入 compose 管理：
  #   docker compose -p dsh-alpha --profile proxy up -d
  # 只有该服务被起时，dsh 服务才应把端口绑到回环（DSH_BIND_IP=127.0.0.1）。
  proxy:
    profiles: ["proxy"]
    image: "${DSH_IMAGE:?DSH_IMAGE 未设置：请先运行 install.sh 生成 .env}"
    container_name: ${DSH_PROXY_CONTAINER:-dsh-proxy}
    restart: unless-stopped
    network_mode: host
    # entrypoint 用镜像自带的（补丁自愈 + DSH_VERSION_PORT=0 判断都在里面）
    command: ["node", "/dsh-root/dsh-proxy-main.js"]
    environment:
      - PORT=${DSH_PORT:-3081}
      - BACKEND=http://127.0.0.1:${DSH_INTERNAL_PORT:-3080}
      # ⚠ 必须与 dsh 服务的 DSH_LAUNCH_TOKEN 完全一致，否则反代回来 401
      - BOOTSTRAP_TOKEN=${DSH_LAUNCH_TOKEN:-}
      - ALLOWED_CIDR=${DSH_ALLOWED_CIDR:-192.168.5.0/24,172.27.0.0/16,127.0.0.0/8}
      # ⚠ 必须为 0：host 网络容器起版本页会抢宿主机 3082（实测踩过）
      - DSH_VERSION_PORT=0
      - DSH_TELEMETRY_DISABLED=1
    volumes:
      - ./dsh-root:/dsh-root:ro
    healthcheck:
      # ⚠ 探活端口必须跟着 PORT 走：生产上 dsh-proxy 的探活是从 dsh 容器抄来的 3080，
      #   而它监听 3081/3083 → 永远探不通、长期 unhealthy（状态失真）。
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:'+(process.env.PORT||3081)+'/').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
