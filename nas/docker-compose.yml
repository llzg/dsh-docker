services:
  deepseek-harness:
    # DSH_IMAGE：默认 latest 由 watchtower 自动跟随更新；
    # 回滚时 rollback.sh 会把旧版本写入同目录 .env 钉住（暂停自动更新），
    # resume-auto-update.sh 恢复跟随 latest。
    image: ${DSH_IMAGE:-ghcr.io/llzg/dsh-docker:latest}
    container_name: deepseek-harness
    restart: unless-stopped
    ports:
      - "3081:3080"
    environment:
      - DSH_HOME=/data/dsh
      - DSH_TELEMETRY_DISABLED=1
    volumes:
      - ./dsh-data:/data/dsh
      # 持久化 /root（含 DSH 工作区 /root/nas_docker）：
      # 容器重建时若工作区目录不存在，bash 工具的 spawn cwd 失效会导致
      # 所有命令报 "spawn <cmd> ENOENT"（2026-08-16 事故根因），挂载后根治。
      - ./dsh-root:/root
    # Intel 核显直通（Iris Xe，加速本地视觉模型的图像编码）：
    # 宿主需已加载 i915 驱动（绿联 x86 NAS 默认有）。应用后需重建容器生效：
    #   docker compose up -d --force-recreate deepseek-harness
    # 无此设备时容器内仍可运行，视觉推理退回纯 CPU。
    devices:
      - /dev/dri:/dev/dri
    labels:
      - "org.opencontainers.image.title=DeepSeek Harness Web (dsh)"
      - "org.opencontainers.image.description=DeepSeek Harness web UI — auto-built from npm release, watchtower auto-update"
